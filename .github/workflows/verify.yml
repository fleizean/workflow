name: Verify

# Runs on every ref and every pull request. This workflow gates; it never releases.
# It grants read-only repository permission and contains no release step, so a push
# to any branch cannot publish an installer (CUSTODY-01 / D-06).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # D-03 backstop. .gitignore already excludes these patterns, so this step exists to
      # catch a deliberate 'git add -f'. A real krono.db pushed to a public repository is
      # unrecoverable: clones taken before any history rewrite keep the user's data forever.
      # Placed before npm ci so it costs seconds rather than a full install when it trips.
      - name: Fail if a database file is tracked by git
        run: |
          tracked=$(git ls-files -- '*.db' '*.db-wal' '*.db-shm')
          if [ -n "$tracked" ]; then
            echo "::error::Database files are tracked by git:"
            echo "$tracked"
            echo "::error::Remove with 'git rm --cached <file>'. A pushed database cannot be un-published (D-03)."
            exit 1
          fi
          echo "No tracked database files."

      # D-13's line-ending contract is unprotected unless CI enforces it. Placed before
      # npm ci so it costs seconds when it fails. 'git diff --check' catches whitespace
      # errors; the renormalise assertion catches the actual D-13 regression - a blob
      # committed with line endings that disagree with .gitattributes, which surfaces
      # later as "whole file changed" on a file nobody edited.
      - name: Check whitespace and line-ending contract
        run: |
          git diff --check
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Committed line endings disagree with .gitattributes in:"
            git diff --cached --name-only
            echo "::error::Fix with: git add --renormalize . && git commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'          # Node 20 is EOL 2026-03-24 (C9). See .nvmrc.
          cache: 'npm'

      # TEMPORARY BRIDGE - REMOVE IN PLAN 01-07 (wave 6).
      # better-sqlite3@9.6.0 ships no N-API prebuild, so its install script falls through
      # to `node-gyp rebuild`, and 9.x's C++ does not compile against Node 24's V8 headers
      # (run 33970229605). D-12 forbids upgrading to 13.x before wave 6, because the parity
      # baseline capture in waves 4-5 needs v1.2.1 running on Electron 28 / N-API 9.
      # --ignore-scripts skips the native build. Nothing this job runs loads the module:
      # eslint does not, and the typecheck/test steps plan 01-02 adds must not either while
      # this flag is in place. Once 13.x lands, the install script is what FETCHES the
      # prebuild, so the flag MUST go - the guard below fails the build if it outlives 9.x.
      - name: Install dependencies (native build skipped - see plan 01-07)
        run: npm ci --ignore-scripts

      - name: Fail if the --ignore-scripts bridge outlived better-sqlite3 9.x
        run: |
          range=$(node -p "const p=require('./package.json');(p.dependencies&&p.dependencies['better-sqlite3'])||(p.devDependencies&&p.devDependencies['better-sqlite3'])||''")
          major=$(printf '%s' "$range" | grep -oE '[0-9]+' | head -1)
          echo "better-sqlite3 range: '${range}' (major ${major:-unknown})"
          if [ -n "$major" ] && [ "$major" -ge 13 ]; then
            echo "::error::better-sqlite3 is now ${range}, which ships N-API prebuilds."
            echo "::error::Drop --ignore-scripts from the install step above and delete this guard (plan 01-07)."
            exit 1
          fi

      - name: Run Linter
        run: npm run lint

      # D-10: the gate is lint + type check + unit tests, each able to fail the job.
      # NEITHER of these may load better-sqlite3 while the --ignore-scripts bridge above is
      # in place - there is no native binary in this job until plan 01-07 (wave 6). tsc only
      # reads type declarations, and tests/ imports node:fs, node:path and node:url only.
      # Verified locally against a tree with no better_sqlite3.node present at all, which is
      # exactly this job's condition.
      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
