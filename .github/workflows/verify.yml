name: Verify

# Runs on every ref and every pull request. This workflow gates; it never releases.
# It grants read-only repository permission and contains no release step, so a push
# to any branch cannot publish an installer (CUSTODY-01 / D-06).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # D-03 backstop. .gitignore already excludes these patterns, so this step exists to
      # catch a deliberate 'git add -f'. A real krono.db pushed to a public repository is
      # unrecoverable: clones taken before any history rewrite keep the user's data forever.
      # Placed before npm ci so it costs seconds rather than a full install when it trips.
      - name: Fail if a database file is tracked by git
        run: |
          tracked=$(git ls-files -- '*.db' '*.db-wal' '*.db-shm')
          if [ -n "$tracked" ]; then
            echo "::error::Database files are tracked by git:"
            echo "$tracked"
            echo "::error::Remove with 'git rm --cached <file>'. A pushed database cannot be un-published (D-03)."
            exit 1
          fi
          echo "No tracked database files."

      # D-13's line-ending contract is unprotected unless CI enforces it. Placed before
      # npm ci so it costs seconds when it fails. 'git diff --check' catches whitespace
      # errors; the renormalise assertion catches the actual D-13 regression - a blob
      # committed with line endings that disagree with .gitattributes, which surfaces
      # later as "whole file changed" on a file nobody edited.
      - name: Check whitespace and line-ending contract
        run: |
          git diff --check
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Committed line endings disagree with .gitattributes in:"
            git diff --cached --name-only
            echo "::error::Fix with: git add --renormalize . && git commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'          # Node 20 is EOL 2026-03-24 (C9). See .nvmrc.
          cache: 'npm'

      # The --ignore-scripts bridge and its expiry guard were removed here, together, by plan
      # 01-07. They existed because better-sqlite3@9.6.0 shipped no prebuild, so its install
      # script fell through to `node-gyp rebuild`, and 9.x's C++ does not compile against Node
      # 24's V8 headers (run 33970229605). D-12 forbade upgrading before the parity baselines
      # were captured on Electron 28 / N-API 9; they are captured, and the driver is now 13.0.3.
      #
      # A correction worth keeping, because the removed comment stated it the other way round
      # and someone will otherwise re-derive the wrong model: 13.0.3 does NOT fetch its binary
      # from an install script. It declares no `install` and no `postinstall` at all, and the
      # eight N-API prebuilds ship inside the npm tarball. Measured both ways in a scratch dir -
      # `npm install better-sqlite3@13.0.3 --ignore-scripts` also yields a loadable binary and
      # no build/ directory. So the flag is not removed to protect the binary; it is removed
      # because its reason expired and because --ignore-scripts is repo-wide, silently
      # suppressing lifecycle scripts for all 433 packages and making CI diverge from what a
      # developer's plain `npm ci` actually does.
      - name: Install dependencies
        run: npm ci

      # This job now has a real native binary, so tests may load better-sqlite3. That is the
      # point of the upgrade: it is what makes the fixture corpus and src/lib/db/backup.ts
      # testable in plain Node under Vitest, with no node-gyp, Python or MSVC (D-08).
      - name: Assert better-sqlite3 loads from a prebuild, with nothing compiled locally
        run: |
          test -d node_modules/better-sqlite3/prebuilds || {
            echo "::error::No prebuilds/ directory - the N-API premise behind D-08 does not hold."; exit 1; }
          if [ -d node_modules/better-sqlite3/build ]; then
            echo "::error::A build/ directory exists, so node-gyp compiled locally."
            echo "::error::The no-compiler claim behind D-08 does not hold on this runner."
            exit 1
          fi
          node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(a)');db.prepare('insert into t values (1)').run();if(db.prepare('select count(*) c from t').get().c!==1)process.exit(1);db.close();console.log('DRIVER_LOADS_OK napi='+process.versions.napi)"

      - name: Run Linter
        run: npm run lint

      # D-10: the gate is lint + type check + unit tests, each able to fail the job.
      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
